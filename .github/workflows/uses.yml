name: Uses Examples
on:
  workflow_dispatch:

jobs:
  Uses-example:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13' 
      - name: run my_script.py
        run: python my_script.py
      
